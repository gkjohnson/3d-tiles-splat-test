<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<meta charset="utf-8"/>

		<title>Gaussian Splat Tiles Test</title>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				font-family: sans-serif;
			}

			canvas {
				outline: none;
			}

			#info {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				padding: 10px;
				color: white;
				text-align: center;
				font-size: 14px;
				pointer-events: none;
				text-shadow: 0 0 3px black;
			}

			#message {
				position: absolute;
				top: 50%;
				left: 50%;
				max-width: 520px;
				transform: translate( -50%, -50% );
				text-align: center;
				line-height: 1.5;
				color: white;
				display: none;
			}

			#footer {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				display: flex;
				color: white;
				font-size: 12px;
				opacity: 0.5;
				padding: 5px;
				line-height: 1.25em;
				pointer-events: none;
			}

			#dataset-credit {
				flex: 1;
			}

			#dataset-credit a {
				color: #fff;
				pointer-events: all;
			}
		</style>

		<!--
			three.js is pinned to the head commit of the gaussian splat group PR so the page keeps
			working when the branch is updated: https://github.com/mrdoob/three.js/pull/34290
			It is served from "src" because the committed build files predate the PR changes.
		-->
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/gh/bhouston/three.js@601b712ca149c442a2a483a5abe91a5243d63caa/src/Three.js",
					"three/webgpu": "https://cdn.jsdelivr.net/gh/bhouston/three.js@601b712ca149c442a2a483a5abe91a5243d63caa/src/Three.WebGPU.js",
					"three/tsl": "https://cdn.jsdelivr.net/gh/bhouston/three.js@601b712ca149c442a2a483a5abe91a5243d63caa/src/Three.TSL.js",
					"three/addons/": "https://cdn.jsdelivr.net/gh/bhouston/three.js@601b712ca149c442a2a483a5abe91a5243d63caa/examples/jsm/",
					"three/examples/jsm/": "https://cdn.jsdelivr.net/gh/bhouston/three.js@601b712ca149c442a2a483a5abe91a5243d63caa/examples/jsm/",
					"3d-tiles-renderer": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.2/build/index.js",
					"3d-tiles-renderer/plugins": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.2/build/index.plugins.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="info">3D Tiles rendered with three.js' GaussianSplatGroup &amp; WebGPURenderer</div>
		<div id="message"></div>
		<div id="footer">
			<div id="dataset-credit">&ldquo;Denver Red Rocks Amphitheatre (ESRI Drone Sample)&rdquo; by <a href="https://superspl.at/user?id=seeget3d" target="_blank" rel="noopener">Seeget3D</a>, via <a href="https://superspl.at/scene/6cafcb4b" target="_blank" rel="noopener">superspl.at</a></div>
			<div id="credits"></div>
		</div>
		<script type="module" src="./main.js"></script>
	</body>
</html>
